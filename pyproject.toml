[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt4ctl"
version = "0.6.0"
description = "MCP server for managing headless MetaTrader terminals over SSH (Wine + systemd)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pavel Volkov", email = "pvolkov@live.ru" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "metatrader",
    "mt4",
    "trading",
    "wine",
    "systemd",
    "devops",
    "ssh",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ak40u/mt4ctl"
Repository = "https://github.com/ak40u/mt4ctl"
Issues = "https://github.com/ak40u/mt4ctl/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[project.scripts]
mt4ctl = "mt4ctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mt4ctl"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]  # long lines in embedded bash templates are intentional

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mt4ctl"]
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastMCP's @mcp.tool() is untyped

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mt4ctl"]
branch = true
